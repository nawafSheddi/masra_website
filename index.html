<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Static shell only: all visible content is built by src/main.ts from
      src/config/strings.ts (single source of copy). Meta tags are the one
      exception — crawlers need them in raw HTML.
    -->
    <title>MASRA Studio — Visual Production & Photography, Riyadh</title>
    <meta
      name="description"
      content="MASRA is a Riyadh visual production studio — artistic, lifestyle and menu photography, from concept to final delivery, for 200+ brands since 2023."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MASRA Studio — Visual Production & Photography, Riyadh" />
    <meta
      property="og:description"
      content="Artistic, lifestyle and menu photography — from concept to final delivery, for 200+ brands since 2023."
    />
    <meta property="og:image" content="/images/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0a09" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Brand type: Ambit Bold carries all display text — fetch it early -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Ambit-Bold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Ambit-Light.woff2" crossorigin />
    <!-- LCP: the hero film-still panel — fetch it before JS builds the DOM -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/images/peti/peti-hero-480.avif 480w, /images/peti/peti-hero-960.avif 960w, /images/peti/peti-hero-1600.avif 1600w"
      imagesizes="(min-width: 768px) 38vw, 70vw"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
