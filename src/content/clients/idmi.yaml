# IDMI · Roast — espresso near-black, crema gold.
# This file IS the /work/idmi page. The file name is the URL.
# Field rules are in src/content.config.ts (npx pnpm check explains any mistake).

name: "IDMI"
order: 2
category: lifestyle   # artistic | lifestyle | menu
year: "2025"
tags: ["Product photography", "Styling"]
description: "Coffee at the black end of the light. Steam, crema, and the first pour of the day held mid-air."

# Page colors (6-digit hex). bg = background, ink = text,
# inkDim = secondary text (keep readable on bg), accent = highlight.
palette:
  bg: "#0a0908"
  bgElevated: "#191512"
  ink: "#e8e2d9"
  inkDim: "#a49b8e"
  accent: "#b08d57"

# Main photo: Work card, top of the gallery, and the share card.
lead:
  image: idmi-strip-1
  alt: "IDMI Coffee Roasters tumblers leaning against a concrete wall"

# Gallery photos, in order. Add one with:
#   npx pnpm media:add --client idmi --file <photo>
frames:
  - image: idmi-strip-1
    alt: "IDMI Coffee Roasters tumblers leaning against a concrete wall"
  - image: idmi-strip-2
    alt: "Colorful IDMI travel tumbler under hard daylight"
  - image: idmi-strip-3
    alt: "Three IDMI tumblers with gazelle artwork in pastel colors"
  - image: idmi-strip-4
    alt: "IDMI tumbler product frame with sharp midday shadow"
  - image: idmi-strip-5
    alt: "Macro texture frame from the IDMI roastery shoot"

# Gallery look + motion. Options: theatrical, strip, stilllife, picnic,
# scrub, gift, documentary (see src/content.config.ts).
layout:
  type: strip
  sceneHeight: 2   # screen-heights the gallery stays pinned (max 2.5)
  label: "Drag through the roast"
