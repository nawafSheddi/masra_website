# Riyadh · Golden — a LIGHT page: kunafa beige, quiet.
# This file IS the /work/riyadh page. The file name is the URL.
# Field rules are in src/content.config.ts (npx pnpm check explains any mistake).

name: "Riyadh"
nameAr: "الرياض"
order: 6
category: menu   # artistic | lifestyle | menu
year: "2026"
tags: ["Photography", "Packaging"]
description: "Kunafa rolled tight and boxed like jewellery. Golden threads photographed in golden hour."

# Page colors (6-digit hex). bg = background, ink = text,
# inkDim = secondary text (keep readable on bg), accent = highlight.
palette:
  bg: "#e9dcc7"
  bgElevated: "#f4ecdd"
  ink: "#2e2416"
  inkDim: "#6d5e45"
  accent: "#a06f1e"

# Main photo: Work card, top of the gallery, and the share card.
lead:
  image: riyadh-lead
  alt: "Open black Riyadh box of kunafa rolls in a strip of sunlight"

# Gallery photos, in order. Add one with:
#   npx pnpm media:add --client riyadh --file <photo>
frames:
  - image: riyadh-frame-1
    alt: "Hands holding kunafa rolls over a small wooden mortar"
  - image: riyadh-frame-2
    alt: "Kunafa roll broken open showing the cream filling"
  - image: riyadh-frame-3
    alt: "Kunafa rolls in a diagonal row on deep cocoa brown"
  - image: riyadh-frame-4
    alt: "Two kunafa rolls staged on an acrylic riser in hard light"

# Gallery look + motion. Options: theatrical, strip, stilllife, picnic,
# scrub, gift, documentary (see src/content.config.ts).
layout:
  type: gift
  sceneHeight: 1.5   # screen-heights the gallery stays pinned (max 2.5)
